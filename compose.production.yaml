services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: rosterly-migrator:production
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: rosterly:production
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a private SETUP_TOKEN in .env.production}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_LABEL: ${AI_PROVIDER_LABEL:-Configured AI provider}
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
