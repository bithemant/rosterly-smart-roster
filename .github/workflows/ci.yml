name: Application checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rosterly:rosterly_local@localhost:5432/rosterly?schema=public
      SETUP_TOKEN: ci-only-not-a-real-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
