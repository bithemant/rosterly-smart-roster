services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rosterly
      POSTGRES_PASSWORD: rosterly_local
      POSTGRES_DB: rosterly
    ports:
      - "5432:5432"
    volumes:
      - rosterly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosterly -d rosterly"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rosterly_postgres:
